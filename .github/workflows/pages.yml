name: Deploy deck

on:
  push:
    branches: [main]
    paths:
      - 'deck/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Official actions/deploy-pages needs a Pages site that already exists.
# Creating one requires repository admin — GITHUB_TOKEN cannot do it
# (configure-pages enablement failed: Resource not accessible by integration).
# Push the static deck to gh-pages instead. Then Settings → Pages →
# Deploy from a branch → gh-pages / (root).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deck
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
